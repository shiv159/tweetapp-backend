spring.application.name=tweetapp-backend

# MongoDB Configuration for Azure Cosmos DB
spring.data.mongodb.uri=mongodb://<cosmos-db-account>:<primary-key>@<cosmos-db-account>.mongo.cosmos.azure.com:10255/?ssl=true&replicaSet=globaldb&retrywrites=false&maxIdleTimeMS=120000&appName=@<cosmos-db-account>@
spring.data.mongodb.database=tweetapp-db

# Optional: Configure connection pool
spring.data.mongodb.max-connection-idle-time=0
spring.data.mongodb.max-connection-life-time=0
spring.data.mongodb.max-connection-pool-size=100

# Caffeine Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
